jenkins:
  systemMessage: "CodeAlpha DevOps Internship - Distributed Jenkins Remoting Cluster"
  numExecutors: 0 # Enforce Controller Security & Node Isolation (0 builds on controller)
  mode: EXCLUSIVE
  scmCheckoutRetryCount: 2

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "admin"
          name: "CodeAlpha Admin"
          description: "DevOps Administrator"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: true

  nodes:
    - permanent:
        name: "remote-linux-agent"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 2
        mode: NORMAL
        labelString: "linux-agent docker-node"
        launcher:
          ssh:
            host: "jenkins-agent"
            port: 22
            credentialsId: "codealpha-ssh-key"
            sshHostKeyVerificationStrategy: "nonVerifyingKeyVerificationStrategy"
        retentionStrategy: "always"

credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "codealpha-ssh-key"
              username: "jenkins"
