jobs:
  - script: >
      pipelineJob('CodeAlpha-Distributed-Build-Job') {
        definition {
          cps {
            sandbox(true)
            script('''
              pipeline {
                  agent { label 'linux-agent' }
                  
                  stages {
                      stage('1. Verify Remote Node & Architecture') {
                          steps {
                              echo '== Connected to Jenkins Remote Agent via SSH Remoting =='
                              sh 'uname -a'
                              sh 'whoami'
                              sh 'hostname'
                              sh 'java -version'
                          }
                      }
                      
                      stage('2. Execute Distributed Workload') {
                          steps {
                              echo '== Running Isolated Workload on Remote Node =='
                              sh 'echo "Simulating automated build and test pipeline..."'
                              sh 'mkdir -p build_output && echo "Build Success on $(hostname)" > build_output/result.txt'
                          }
                      }
                      
                      stage('3. Node Isolation & Security Audit') {
                          steps {
                              echo '== Verifying Node Security Isolation =='
                              sh 'pwd'
                              sh 'ls -la'
                              sh 'cat build_output/result.txt'
                          }
                      }
                  }
                  
                  post {
                      always {
                          echo '== Distributed Job Completed Successfully on Remote Agent! =='
                      }
                  }
              }
            '''.stripIndent())
          }
        }
      }
